name: build-android
on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp

      - name: Install newer cmake
        run: pip install cmake

      - name: Build for arm64
        run: |
          NDK=$ANDROID_NDK_LATEST_HOME
          cmake -S llama.cpp/examples/llama.android/lib/src/main/cpp -B build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_LLAMAFILE=OFF
          cmake --build build -j4

      - name: Collect files
        run: |
          mkdir -p out/jniLibs/arm64-v8a out/kotlin
          find build -name "*.so" -exec cp {} out/jniLibs/arm64-v8a/ \;
          find $ANDROID_NDK_LATEST_HOME -name libomp.so -path "*aarch64*" | head -1 | xargs -I{} cp {} out/jniLibs/arm64-v8a/
          cp -r llama.cpp/examples/llama.android/lib/src/main/java/* out/kotlin/
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded out/jniLibs/arm64-v8a/*.so
          ls -la out/jniLibs/arm64-v8a
          cd out && zip -r ../llama-android.zip .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          files: llama-android.zip
